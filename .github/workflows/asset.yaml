
name: Free Fire Asset Browser

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/extract.yml"
      - "site/assets/**"
      - "site/index.html"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip python3

      - name: Download APK
        run: |
          curl -L --fail --retry 3 \
            "https://github.com/whymetamvan/kpa-patch/releases/download/v1.132.1-1/free-fire-1-132-1.apk" \
            -o game.apk

      - name: Extract and scan APK
        run: |
          mkdir -p site/assets/apk

          python3 <<'PY'
          import zipfile
          import json
          import os
          from pathlib import PurePosixPath

          apk = "game.apk"

          unity_extensions = (
              ".bundle",
              ".assets",
              ".ress",
              ".resource",
              ".unity3d",
              ".asset"
          )

          image_extensions = (
              ".png",
              ".jpg",
              ".jpeg",
              ".webp",
              ".gif"
          )

          candidates = []
          images = []

          max_file_size = 20 * 1024 * 1024
          max_total_size = 200 * 1024 * 1024
          total_size = 0

          os.makedirs("site/assets/apk", exist_ok=True)

          with zipfile.ZipFile(apk, "r") as archive:

              for item in archive.infolist():

                  if item.is_dir():
                      continue

                  name = item.filename
                  lower = name.lower()

                  # Identify Unity files
                  if lower.endswith(unity_extensions):
                      candidates.append({
                          "path": name,
                          "size": item.file_size
                      })

                  # Find ordinary image files
                  if not lower.endswith(image_extensions):
                      continue

                  path = PurePosixPath(name)

                  if path.is_absolute() or ".." in path.parts:
                      continue

                  if item.file_size > max_file_size:
                      continue

                  if total_size + item.file_size > max_total_size:
                      continue

                  content = archive.read(item)

                  extension = path.suffix.lower()
                  filename = f"{len(images):05d}{extension}"

                  output = os.path.join(
                      "site/assets/apk",
                      filename
                  )

                  with open(output, "wb") as file:
                      file.write(content)

                  images.append(
                      "assets/apk/" + filename
                  )

                  total_size += len(content)

          manifest = {
              "apk": os.path.basename(apk),
              "candidate_files": candidates,
              "images": images,
              "total_images": len(images),
              "total_image_size": total_size
          }

          with open("site/manifest.json", "w") as file:
              json.dump(manifest, file, indent=2)

          print("Unity files:", len(candidates))
          print("Images:", len(images))
          print("Image size:", total_size)
          PY

      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: free-fire-asset-inventory
          path: site/manifest.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy website
        uses: actions/deploy-pages@v4
