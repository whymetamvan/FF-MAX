
      - name: Inspect APK and extract loose images
        run: |
          python - <<'PY'
          import zipfile
          import json
          import os
          from pathlib import PurePosixPath

          apk = "game.apk"
          os.makedirs("site/assets/apk", exist_ok=True)

          extensions = (
              ".bundle", ".assets", ".ress",
              ".resource", ".unity3d", ".asset"
          )

          image_extensions = (
              ".png", ".jpg", ".jpeg", ".webp", ".gif"
          )

          candidates = []
          images = []
          total_size = 0
          max_file = 20 * 1024 * 1024
          max_total = 200 * 1024 * 1024

          with zipfile.ZipFile(apk) as z:
              for item in z.infolist():
                  if item.is_dir():
                      continue

                  name = item.filename
                  lower = name.lower()

                  if lower.endswith(extensions):
                      candidates.append({
                          "path": name,
                          "size": item.file_size
                      })

                  if not lower.endswith(image_extensions):
                      continue

                  path = PurePosixPath(name)

                  if path.is_absolute() or ".." in path.parts:
                      continue

                  if item.file_size > max_file:
                      continue

                  if total_size + item.file_size > max_total:
                      continue

                  content = z.read(item)
                  output_name = f"apk/{len(images):05d}_{path.name}"
                  output_path = os.path.join(
                      "site/assets", output_name
                  )

                  with open(output_path, "wb") as f:
                      f.write(content)

                  total_size += len(content)

                  images.append({
                      "path": "assets/" + output_name,
                      "size": len(content),
                      "original": name
                  })

          manifest = {
              "candidate_files": candidates,
              "images": images
          }

          with open("site/manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)

          print("Unity candidates:", len(candidates))
          print("Extracted images:", len(images))
          print("Total image size:", total_size)
          PY
